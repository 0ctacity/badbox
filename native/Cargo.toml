[package]
name = "badbox-native"
version = "0.0.1"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bench]]
name = "aggregation"
harness = false

[dependencies]
anyhow = "1"
ast-grep-core = "=0.45.1"
ast-grep-language = { version = "=0.45.1", default-features = false, features = ["tree-sitter-rust", "tree-sitter-go"] }
ignore = "0.4"
napi = "=3.12.2"
napi-derive = "=3.6.3"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "=0.10.0"

[build-dependencies]
napi-build = "2"
